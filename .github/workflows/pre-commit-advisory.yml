name: Pre-commit (advisory)

# Non-blocking pre-commit run that surfaces what the repo's local
# pre-commit hooks would flag on this PR's diff. Posts (or updates) a
# sticky PR comment with the output, and fails the job on hook failure
# so engineers see a ❌ check — but this workflow is NOT required for
# merge in any repo's branch protection, so it never blocks.
#
# Why advisory and not required: org-wide pre-commit configs accumulate
# over time, and existing repos carry pre-existing violations. Forcing
# every PR to fix the org-wide debt before merge would block real work.
# We scope to PR-diff (--from-ref/--to-ref) so engineers only see
# violations they introduced or touched, and let social pressure build
# the habit without a hard gate.
#
# If a repo wants to harden this into a merge-blocking check, add this
# workflow's job name to the repo's branch protection required checks
# in the GitHub UI — no caller-side YAML change needed.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version used to run pre-commit. The hooks themselves use their own languages (see setup-dotnet, setup-node-pnpm)."
        type: string
        default: "3.13"
      setup-dotnet:
        description: |
          When true, install .NET SDK + `dotnet tool restore` before running
          pre-commit. Required when the repo has hooks that invoke `dotnet`
          tools (e.g. csharpier). .NET SDK itself is cached by setup-dotnet
          across runs; tool restore reads `.config/dotnet-tools.json`.
        type: boolean
        default: false
      dotnet-version:
        description: ".NET SDK version. Ignored when setup-dotnet=false."
        type: string
        default: "10.0.x"
      setup-node-pnpm:
        description: |
          When true, enable corepack + install Node + `pnpm install --frozen-lockfile`
          before running pre-commit. Required when the repo has hooks that
          invoke pnpm/node binaries (e.g. ui-eslint, ui-prettier). Node and
          pnpm store are cached by setup-node + setup-uv across runs.
        type: boolean
        default: false
      node-version:
        description: "Node version. Ignored when setup-node-pnpm=false."
        type: string
        default: "24"
      private-modules:
        description: >-
          When true, mint a short-lived read-only pinpredict-argocd App token
          (BOOTSTRAP_APP_ID / BOOTSTRAP_APP_PRIVATE_KEY — callers must pass
          `secrets: inherit`) and configure a git insteadOf rewrite + GOPRIVATE
          before running pre-commit, so hooks that resolve Go modules
          (go-mod-tidy-repo, the golangci-lint typecheck) can fetch private
          github.com/pinpredict/* modules (e.g. ppkit). Same App and pattern as
          docker-release.yml's private-modules input. Default false — a no-op
          for every existing caller.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  advisory:
    runs-on: ubuntu-latest
    # Runs on pull_request (the advisory check itself) AND on push to
    # the default branch (cache-seed only — installs hook envs into
    # ~/.cache/pre-commit so PR branches can restore them).
    #
    # Why the push-to-main run matters: GitHub Actions caches are
    # scoped per branch. A PR branch can only restore caches from its
    # own branch or the repo's default branch. Without a push-to-main
    # run, the default-branch scope is never populated, so every new
    # PR branch rebuilds hook envs from scratch on its first run.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    # The push run seeds caches and gates nothing — its hook steps already
    # end in `|| true` and the "reflect exit code" step below is
    # pull_request-only, so it can never legitimately go red. It could still
    # fail on an *infrastructure* step, and did: a transient
    # `curl: (35) Recv failure: Connection reset by peer` while downloading
    # the go-pre-commit release archive turned an otherwise-green k5s main
    # into a red ❌ (k5s run 30964880559; a plain re-run went green with no
    # change). A seed run failing costs PRs a cold cache, not correctness —
    # that is not worth painting a service repo's default branch red.
    #
    # PR runs are unaffected: they keep failing loudly so engineers still see
    # the ❌ that makes the advisory comment worth reading.
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Opt-in (private-modules: true): mint a short-lived, read-only token for
      # the org-wide pinpredict-argocd App so module-resolving hooks
      # (go-mod-tidy-repo, golangci-lint) can fetch private pinpredict Go
      # modules without vendoring. contents:read across the org (the App is
      # installed on all repos). Skipped for every caller that leaves
      # private-modules at its default.
      - name: Mint private-module read token
        id: private-module-token
        if: ${{ inputs.private-modules }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOOTSTRAP_APP_ID }}
          private-key: ${{ secrets.BOOTSTRAP_APP_PRIVATE_KEY }}
          owner: pinpredict
          permission-contents: read

      # The token never lands in the checkout or the hook-env cache: it lives
      # in the runner-local global git config, and GOPRIVATE bypasses the
      # public proxy + checksum DB for org modules.
      - name: Configure git for private Go modules
        if: ${{ inputs.private-modules }}
        env:
          GH_PRIVATE_TOKEN: ${{ steps.private-module-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_PRIVATE_TOKEN}@github.com/pinpredict/".insteadOf \
            "https://github.com/pinpredict/"
          echo "GOPRIVATE=github.com/pinpredict/*" >> "$GITHUB_ENV"

      # Python is still needed for `language: python` hooks (ruff, …) —
      # go-pre-commit builds their venvs with the interpreter on PATH.
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      # Key prefix is go-pre-commit-* so envs built by the old Python
      # pre-commit are never restored into the Go implementation.
      - name: Cache pre-commit hook envs
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: go-pre-commit-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            go-pre-commit-${{ runner.os }}-py${{ inputs.python-version }}-

      # go-pre-commit (github.com/blairham/go-pre-commit) — drop-in Go
      # reimplementation of pre-commit; no pip install. install-only: this
      # workflow drives pre-commit itself (diff-scoped run below + the
      # install-hooks cache seed), and the cache step above owns caching.
      - name: Install go-pre-commit
        uses: blairham/go-pre-commit@v4.6.0
        with:
          version: v4.6.0
          install-only: 'true'
          cache: 'false'

      # Hooks with `language: golang` (the upstream golangci-lint hooks) are
      # built by pre-commit with whatever `go` is on PATH. The runner's
      # preinstalled Go can lag the repos' targeted version, and a
      # golangci-lint built with an older toolchain refuses to load a config
      # targeting a newer one ("the Go language version used to build
      # golangci-lint is lower than the targeted Go version"). Pin GOTOOLCHAIN
      # to the highest `go` directive found in the repo so the go command
      # auto-provisions that toolchain for the hook builds. No-op for repos
      # without a go.mod. Only full X.Y.Z directives are pinned — a bare
      # major.minor can't name a toolchain.
      - name: Pin Go toolchain for golang hooks
        run: |
          ver=$(find . -name go.mod -not -path '*/vendor/*' -not -path '*/node_modules/*' \
            -exec awk '/^go [0-9]/{print $2}' {} + | sort -V | tail -1)
          case "$ver" in
            *.*.*)
              echo "GOTOOLCHAIN=go${ver}" >> "$GITHUB_ENV"
              echo "Pinned GOTOOLCHAIN=go${ver}"
              ;;
            *)
              echo "No full X.Y.Z go directive found (got '${ver:-none}') — leaving GOTOOLCHAIN unset"
              ;;
          esac

      # Go caches for the `language: golang` hooks (go-mod-tidy-repo,
      # golangci-lint). pre-commit diff-scopes the *trigger* (the hooks are
      # skipped when no .go file changed), but the hooks themselves are
      # pass_filenames:false — golangci-lint typechecks the whole module and
      # go mod tidy re-resolves the full module graph. Cold, that costs
      # ~4 minutes per run (measured on chaos-lab: 42s tidy + 3m27s lint);
      # warm, the same hooks re-analyze only what changed. ~/go/pkg/mod also
      # holds the GOTOOLCHAIN auto-provisioned toolchain from the pin step
      # above. Restore-only here: PR runs never save (a per-sha, ~0.5-1GB
      # cache per push would churn the repo's 10GB cache budget); the
      # push-to-default-branch seed run saves below, so PRs restore a cache
      # at most one merge behind.
      - name: Restore Go hook caches
        if: hashFiles('**/go.sum') != ''
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-hook-caches-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            go-hook-caches-${{ runner.os }}-

      # Optional: install .NET SDK + restore local tools (csharpier, etc).
      # setup-dotnet@v5 caches the SDK by version across runs.
      - name: Set up .NET
        if: inputs.setup-dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # Cache the dotnet tool install directory keyed on the tools manifest.
      # ~/.dotnet/tools is tiny but the install (`dotnet tool restore`)
      # downloads csharpier + any other tools; cache makes it a no-op on
      # warm runs.
      - name: Cache dotnet tools
        if: inputs.setup-dotnet
        uses: actions/cache@v6
        with:
          path: ~/.dotnet/tools
          key: dotnet-tools-${{ runner.os }}-${{ hashFiles('**/dotnet-tools.json') }}
          restore-keys: |
            dotnet-tools-${{ runner.os }}-

      - name: Restore .NET tools
        if: inputs.setup-dotnet
        run: dotnet tool restore

      # Optional: install Node + enable pnpm + install workspace deps.
      # setup-node@v6 with cache:pnpm caches the pnpm content-addressable
      # store across runs, so `pnpm install --frozen-lockfile` is mostly
      # a symlink-create after the first run (5-10s typical).
      - name: Enable corepack (pnpm)
        if: inputs.setup-node-pnpm
        run: corepack enable

      - name: Set up Node.js
        if: inputs.setup-node-pnpm
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node workspace deps
        if: inputs.setup-node-pnpm
        run: pnpm install --frozen-lockfile

      # Push-to-default-branch runs exist only to populate
      # ~/.cache/pre-commit (and ~/.dotnet/tools / pnpm store) into
      # the default-branch cache scope so PR branches can restore
      # them. install-hooks downloads + builds every hook env without
      # executing any hook, so we don't replay org-wide debt on main.
      - name: Install pre-commit hook envs (cache seed)
        if: github.event_name == 'push'
        run: pre-commit install-hooks

      # install-hooks builds hook envs but never *executes* the Go hooks, so
      # the default-branch scope would otherwise never hold a warm Go
      # module/build/lint cache and every PR would pay the cold whole-module
      # lint. Execute the Go hooks here to populate those caches. `|| true`
      # on each: this is a cache seed, not a gate — whole-repo runs replay
      # org-wide debt on purpose here, and repos without one of these hook
      # ids just skip it.
      - name: Warm Go hook caches (cache seed)
        if: github.event_name == 'push' && hashFiles('**/go.sum') != ''
        run: |
          pre-commit run go-mod-tidy-repo --all-files || true
          pre-commit run golangci-lint --all-files || true

      - name: Save Go hook caches (cache seed)
        if: github.event_name == 'push' && hashFiles('**/go.sum') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-hook-caches-${{ runner.os }}-${{ github.sha }}

      - name: Run pre-commit on PR diff
        if: github.event_name == 'pull_request'
        id: precommit
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          # --from-ref/--to-ref restricts the run to files changed in
          # this PR's diff, so engineers don't get blasted with org-wide
          # pre-existing violations on unrelated lines.
          pre-commit run \
            --from-ref "$BASE_SHA" \
            --to-ref "$HEAD_SHA" \
            --show-diff-on-failure \
            --color never \
            2>&1 | tee /tmp/precommit.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Build PR comment body
        if: github.event_name == 'pull_request'
        id: body
        env:
          EXIT_CODE: ${{ steps.precommit.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$EXIT_CODE" = "0" ]; then
            cat > /tmp/body.md <<EOF
          <!-- pre-commit-advisory -->
          ✅ **pre-commit (advisory)** — no issues on changed files.
          EOF
          else
            # Truncate the log to a reasonable comment size — GitHub
            # comments cap at 65k chars; keep a safe margin for the
            # surrounding boilerplate.
            log_excerpt=$(head -c 50000 /tmp/precommit.log)
            {
              echo "<!-- pre-commit-advisory -->"
              echo "⚠️ **pre-commit (advisory)** would flag the following on this PR's diff."
              echo ""
              echo "This check is **non-blocking** — it surfaces what your local pre-commit hooks would catch. To reproduce + fix locally:"
              echo ""
              echo '```bash'
              echo "pre-commit run --from-ref origin/main --to-ref HEAD"
              echo '```'
              echo ""
              echo "Full run log: $RUN_URL"
              echo ""
              echo "<details><summary>Hook output (truncated to 50KB)</summary>"
              echo ""
              echo '```'
              echo "$log_excerpt"
              echo '```'
              echo ""
              echo "</details>"
            } > /tmp/body.md
          fi
          echo "path=/tmp/body.md" >> "$GITHUB_OUTPUT"

      - name: Find existing advisory comment
        if: github.event_name == 'pull_request'
        id: find
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: <!-- pre-commit-advisory -->

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ steps.body.outputs.path }}
          edit-mode: replace

      - name: Reflect pre-commit exit code as the job's status
        if: github.event_name == 'pull_request' && steps.precommit.outputs.exit_code != '0'
        run: |
          echo "::error::pre-commit found issues on this PR's diff. See the sticky PR comment and the run log."
          exit 1
