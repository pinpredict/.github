name: Setup Go
description: |
  Install Go from the repo's go.mod toolchain directive. Standard Go-setup
  recipe for pinpredict Go repos (service-template and anything templated
  from it).

  Caches the Go module + build caches per CALLING JOB (the cache key
  includes `github.job`) instead of using setup-go@v6's built-in cache.
  The built-in cache keys once per go.sum for the whole repo, so the
  first job to save wins the key and every sibling job restores
  artifacts compiled with the wrong flags, recompiles from scratch, and
  never saves its own ("Cache hit occurred on the primary key …, not
  saving cache"). Concretely: a `go test -race -coverprofile` job kept
  restoring the build job's plain artifacts and recompiled the entire
  dependency graph on every run (~3.5 min in k5s against ~30 s of actual
  test time). Per-job keys keep each flag set (plain build, race+cover
  test, goreleaser) warm independently. `cache-name` overrides the
  scope for jobs that should share; `cache-name: "false"` disables
  caching. Reading the version from go.mod means the caller doesn't pin
  Go in two places — bumping `go x.yy.z` in go.mod drives CI.

  The key also carries a refresh window (`cache-refresh-hours`, default
  24), and only default-branch runs save, so every PR restores a main
  cache at most one window old instead of whichever commit first saved
  for its go.sum.

  Optional `private-modules: true` mints a short-lived, read-only
  pinpredict-argocd App token and configures git + GOPRIVATE so `go`,
  `golangci-lint`, and `goreleaser` can fetch a private pinpredict module
  (e.g. github.com/pinpredict/ppkit) without committing a vendor/ tree.
  This is the non-Docker analogue of docker-release.yml's `private-modules`
  BuildKit secret. Default false — a no-op for every existing caller.

inputs:
  go-version-file:
    description: "Path to go.mod (or any file with a `go` directive)."
    required: false
    default: "go.mod"
  cache-name:
    description: >-
      Scope name for the Go module + build cache. Empty (the default)
      scopes the cache to the calling job's id (`github.job`), so each
      job's differently-flagged compile artifacts stay warm
      independently. Set a fixed name to share one cache between jobs
      that compile identically, or "false" to skip caching entirely.
    required: false
    default: ""
  cache-refresh-hours:
    description: >-
      How often a default-branch run may save a new cache entry, in whole
      hours (windows are aligned to the Unix epoch, so 24 = one UTC day).
      Lower keeps PRs closer to main's newest cache; higher writes fewer
      entries against the repo's 10 GB cache cap, where superseded entries
      wait for LRU eviction. Default 24.
    required: false
    default: "24"
  private-modules:
    description: >-
      When true, mint a read-only pinpredict-argocd App token from
      private-modules-app-id / private-modules-app-private-key and configure
      git (a scheme-scoped `insteadOf` for github.com/pinpredict/) plus
      GOPRIVATE, so Go tooling fetches private pinpredict modules over HTTPS
      instead of failing on the public proxy. Default false.
    required: false
    default: "false"
  private-modules-app-id:
    description: >-
      App ID for the private-module read token (the org secret
      BOOTSTRAP_APP_ID — the pinpredict-argocd App). Required when
      private-modules is true.
    required: false
    default: ""
  private-modules-app-private-key:
    description: >-
      App private key for the private-module read token (the org secret
      BOOTSTRAP_APP_PRIVATE_KEY). Required when private-modules is true.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: ${{ inputs.go-version-file }}
        # Built-in caching stays off: it keys ONE cache per go.sum for every
        # job in the repo, so only the first job to save ever populates it and
        # differently-flagged sibling jobs (e.g. `go test -race -cover…`)
        # recompile the world on every run. The per-job cache below replaces it.
        cache: false

    # Module + build caches, scoped per calling job (or per `cache-name`) and
    # keyed per REFRESH WINDOW (`cache-refresh-hours`, default one UTC day),
    # so PRs restore a default-branch cache at most one window old. A key
    # with no time component froze: actions/cache never re-saves a key it
    # hit, so one entry per go.sum stood for every later commit, and legate's
    # PRs reran ~5 min of tests for packages they never touched because the
    # cache predated 35 commits of main.
    #
    # The window, not the commit, is what bounds the entry COUNT. Superseded
    # entries are never deleted (that needs `actions: write`, which the org's
    # read-only default token lacks and a composite cannot grant), so they
    # sit against the 10 GB per-repo cap until LRU evicts them, shortening
    # how long every other cache in the repo survives. A per-commit key wrote
    # one ~1 GB entry per push; this writes at most one per scope per window
    # (pinpredict/.github#62 is the same churn in pre-commit-advisory).
    #
    # Only a run on the default branch saves, and its restore stays inside
    # the same go.mod/go.sum hash, which is what bounds each entry's SIZE:
    # the module set cannot change within it, and Go trims build-cache
    # entries unused for 5 days. A seed that restored across go.sum changes
    # is how the pre-commit Go cache grew 4.7x until it filled a runner's
    # disk (#69). The cost: the first default-branch run after ANY go.mod or
    # go.sum change in the repo compiles from cold (legate: 12 such commits
    # in the 30 days to 2026-10-25). Every other run (PRs, tags, merge queue)
    # restores only, falling back to the same scope with an older go.sum
    # (near-warm after a dep bump), then to any scope (a cold test job still
    # inherits the build job's module download cache). Paths are the Linux
    # defaults — every pinpredict runner (GitHub-hosted and the EKS/ARC scale
    # sets) is Linux; a macOS caller would just miss the cache, not break.
    - name: Compute the Go cache refresh window
      id: go-cache-window
      if: ${{ inputs.cache-name != 'false' }}
      shell: bash
      env:
        REFRESH_HOURS: ${{ inputs.cache-refresh-hours }}
      run: |
        set -euo pipefail
        hours="$REFRESH_HOURS"
        if ! [[ "$hours" =~ ^[1-9][0-9]*$ ]]; then
          echo "::warning title=setup-go::cache-refresh-hours must be a positive integer, got '$hours'; using 24."
          hours=24
        fi
        echo "window=$(( $(date -u +%s) / (hours * 3600) ))" >> "$GITHUB_OUTPUT"

    - name: Restore and save Go module + build caches
      if: ${{ inputs.cache-name != 'false' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      uses: actions/cache@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: setup-go-job-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-name || github.job }}-${{ hashFiles(inputs.go-version-file, '**/go.sum') }}-${{ steps.go-cache-window.outputs.window }}
        restore-keys: |
          setup-go-job-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-name || github.job }}-${{ hashFiles(inputs.go-version-file, '**/go.sum') }}-

    - name: Restore Go module + build caches
      if: ${{ inputs.cache-name != 'false' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: setup-go-job-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-name || github.job }}-${{ hashFiles(inputs.go-version-file, '**/go.sum') }}-${{ steps.go-cache-window.outputs.window }}
        restore-keys: |
          setup-go-job-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-name || github.job }}-${{ hashFiles(inputs.go-version-file, '**/go.sum') }}-
          setup-go-job-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-name || github.job }}-
          setup-go-job-${{ runner.os }}-${{ runner.arch }}-

    # Opt-in (private-modules: true): mint a short-lived, read-only token for
    # the org-wide pinpredict-argocd App so `go mod download` / golangci /
    # goreleaser can fetch private pinpredict modules without a vendor/ tree.
    # Skipped entirely (no token, no git rewrite) for every caller that leaves
    # private-modules at its default false.
    - name: Mint private-module read token
      id: private-module-token
      if: ${{ inputs.private-modules == 'true' }}
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.private-modules-app-id }}
        private-key: ${{ inputs.private-modules-app-private-key }}
        owner: pinpredict
        permission-contents: read

    - name: Configure private-module fetch
      if: ${{ inputs.private-modules == 'true' }}
      shell: bash
      env:
        GH_PRIVATE_TOKEN: ${{ steps.private-module-token.outputs.token }}
      run: |
        set -euo pipefail
        # Rewrite only pinpredict HTTPS remotes to carry the minted token; the
        # token is org-scoped and read-only, and the rewrite is limited to our
        # org so it never leaks onto unrelated github.com fetches.
        git config --global \
          url."https://x-access-token:${GH_PRIVATE_TOKEN}@github.com/pinpredict/".insteadOf \
          "https://github.com/pinpredict/"
        # GOPRIVATE keeps these modules off the public proxy + checksum DB.
        echo "GOPRIVATE=github.com/pinpredict/*" >> "$GITHUB_ENV"
